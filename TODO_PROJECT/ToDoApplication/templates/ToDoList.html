{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container py-4">
  <div class="row mb-3 align-items-center">
    <div class="col-md-2"><h4>Filters</h4></div>
    <div class="col-md-3"><select id="priority-filter" class="form-select"><option value="0">All Priorities</option><option value="1">High Priority</option><option value="2">Medium Priority</option><option value="3">Low Priority</option></select></div>
    <div class="col-md-3"><select id="status-filter" class="form-select"><option value="0">All Statuses</option><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select></div>
    <div class="col-md-3"><button type="button" class="btn btn-primary" id="addTaskBtn" data-bs-toggle="modal" data-bs-target="#taskModal">Add Task</button></div>
  </div>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="taskModalLabel">Add Task</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><form id="taskForm">{% csrf_token %}
        <div class="mb-3"><label for="titleInput" class="form-label">Title</label><input type="text" class="form-control" id="titleInput" maxlength="200" required><div id="titleError" class="error text-danger"></div></div>
        <div class="mb-3"><label for="descriptionInput" class="form-label">Description</label><textarea class="form-control" id="descriptionInput"></textarea><div id="descriptionError" class="error text-danger"></div></div>
        <div class="mb-3"><label for="prioritySelect" class="form-label">Priority</label><select class="form-select" id="prioritySelect" required><option value="" selected disabled>Select Priority</option><option value="1">High Priority</option><option value="2">Medium Priority</option><option value="3">Low Priority</option></select><div id="priorityError" class="error text-danger"></div></div>
        <div class="mb-3 statusSelection"><label for="statusSelect" class="form-label">Status</label><select class="form-select" id="statusSelect"><option value="" selected disabled>Select Status</option><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select><div id="statusError" class="error text-danger"></div></div>
        <button type="submit" class="btn btn-primary submitBtn">Add Task</button>
      </form></div>
    </div></div>
  </div>

  <div class="modal fade" id="deleteTaskModal" tabindex="-1" aria-labelledby="deleteTaskModalLabel" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="deleteTaskModalLabel">Confirm Deletion</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><p>Are you sure you want to delete this task?</p></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button></div></div></div></div>
  <ul id="task-list" class="list-group"></ul>
</div>
<script src="{% static 'js/toDoList.js' %}"></script>
{% endblock %}
